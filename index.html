  const handleAnswer = (value) => {

      let newAnswers;
      
      if (currentAnswers.includes(value)) {
        // 既に選択されていたら除外
        newAnswers = currentAnswers.filter(v => v !== value);
      } else {
        // 選択されていなかったら追加
        newAnswers = [...currentAnswers, value];
      }
      
      setAnswers({ ...answers, [question.id]: newAnswers });
    } else {
      // 単一選択の場合
      setAnswers({ ...answers, [question.id]: value });

      if (currentQuestion < questions.length - 1) {
        setTimeout(() => {
          setCurrentQuestion(currentQuestion + 1);
        }, 300);
      } else {
        // 診断完了
        setTimeout(() => {

  const calculateResult = (finalAnswers) => {
    const q1 = finalAnswers[1];
    const q2 = finalAnswers[2];
    const q3 = finalAnswers[3];
    const q4 = finalAnswers[4];
    const q5 = finalAnswers[5];
    const q6 = finalAnswers[6] || []; // 心配事（複数選択）
    const q7 = finalAnswers[7]; // 相談

    // 距離判定
    const isCohabiting = q1 === 'A';
    const isNear = q1 === 'B';
    const isFar = q1 === 'C' || q1 === 'D';

    // 1. セイジ：Q6で3つ以上選択 かつ Q7=C
    if (q6.length >= 3 && q7 === 'C') {
      setResult(types.セイジ);
      return;
    }

    // 2. グラップラー：Q1=同居 かつ Q2=A かつ Q3=B かつ Q7=C
    if (isCohabiting && q2 === 'A' && q3 === 'B' && q7 === 'C') {
      setResult(types.グラップラー);
      return;
    }

    // 3. ナイト：親族協力体制がある（Q4=AまたはB）かつ 主に担わない（Q2≠A）かつ 自分が主導権を持たない（Q3≠B）
    if ((q4 === 'A' || q4 === 'B') && q2 !== 'A' && q3 !== 'B') {
      setResult(types.ナイト);
      return;
    }

    // 4. クレリック：主導権が無い（Q3=AまたはC）かつ リスク低め（Q2=CまたはD）
    if ((q3 === 'A' || q3 === 'C') && (q2 === 'C' || q2 === 'D')) {
      setResult(types.クレリック);
      return;
    }

    // 5. ニンジャ：Q1=近距離 かつ Q2=A
    if (isNear && q2 === 'A') {
      setResult(types.ニンジャ);
      return;
    }

    // 6. ダンサー：Q1=近距離 かつ Q2≠A かつ Q5=AまたはB
    if (isNear && q2 !== 'A' && (q5 === 'A' || q5 === 'B')) {
      setResult(types.ダンサー);
      return;
    }

    // 7. シューター：Q1=遠距離 かつ Q3=B かつ Q5=AまたはB
    if (isFar && q3 === 'B' && (q5 === 'A' || q5 === 'B')) {
      setResult(types.シューター);
      return;
    }

    // 8. サモナー：Q1=遠距離 かつ Q3=B かつ Q5=CまたはD
    if (isFar && q3 === 'B' && (q5 === 'C' || q5 === 'D')) {
      setResult(types.サモナー);
      return;
    }

    // 9. テイマー：Q1=同居または近距離 かつ Q3=B かつ Q5=CまたはD
    if ((isCohabiting || isNear) && q3 === 'B' && (q5 === 'C' || q5 === 'D')) {
      setResult(types.テイマー);
      return;
    }

    // 10. ギャンブラー：Q3=D かつ Q5=CまたはD
    if (q3 === 'D' && (q5 === 'C' || q5 === 'D')) {
      setResult(types.ギャンブラー);
      return;
    }

    // 11. デフォルト：該当なし → サモナー（最も柔軟なタイプ）
    setResult(types.サモナー);
  };

  // Q6の回答からQAカテゴリを取得
  const getQACategories = (q6Answers) => {
    const categoryMap = {
      'A': { title: '負担軽減', url: 'https://navi.lyxis.com/q_a/search/tag_category/4' },
      'B': { title: '負担軽減', url: 'https://navi.lyxis.com/q_a/search/tag_category/4' },
      'C': { title: '負担軽減', url: 'https://navi.lyxis.com/q_a/search/tag_category/4' },
      'D': { title: '職場・働き方', url: 'https://navi.lyxis.com/q_a/search/tag_category/8' },
      'E': { title: '介護サービスの使い方', url: 'https://navi.lyxis.com/q_a/search/tag_category/1' },
      'F': { title: '家族間のコミュニケーション', url: 'https://navi.lyxis.com/q_a/search/tag_category/3' },
      'G': { title: '見守り・緊急時対応・遠距離介護', url: 'https://navi.lyxis.com/q_a/search/tag_category/5' },
      'H': { title: '認知症の対応', url: 'https://navi.lyxis.com/q_a/search/tag_category/7' },
      'I': { title: '負担軽減', url: 'https://navi.lyxis.com/q_a/search/tag_category/4' }
    };

    if (!q6Answers || q6Answers.length === 0 || q6Answers.includes('J')) {
      // デフォルト
      return [
        { title: '介護サービスの使い方', url: 'https://navi.lyxis.com/q_a/search/tag_category/1' },
        { title: '負担軽減', url: 'https://navi.lyxis.com/q_a/search/tag_category/4' }
      ];
    }

    // 重複排除して最大2つ取得
    const categories = [];
    const seen = new Set();
    
    for (const answer of q6Answers) {
      if (categoryMap[answer] && !seen.has(categoryMap[answer].url)) {
        categories.push(categoryMap[answer]);
        seen.add(categoryMap[answer].url);
        if (categories.length >= 2) break;
      }
    }

    // 1つしかない場合はデフォルトの「介護サービスの使い方」を追加
    if (categories.length === 1) {
      const defaultCategory = { title: '介護サービスの使い方', url: 'https://navi.lyxis.com/q_a/search/tag_category/1' };
      if (!seen.has(defaultCategory.url)) {
        categories.push(defaultCategory);
      }
    }

    return categories;
  };

  const resetDiagnosis = () => {
    setCurrentQuestion(0);
    setAnswers({});
    setResult(null);
    setStarted(false);
  };

  const currentQ = questions[currentQuestion];

  if (!started) {
    const topImages = [
      { name: 'ニンジャ', url: 'https://github.com/user-attachments/assets/e66602e6-a7c7-4bf9-89a1-0c03f1ab7f27' },
      { name: 'ギャンブラー', url: 'https://github.com/user-attachments/assets/97f5eb77-75ca-45c3-b7be-aea64205c770' },
      { name: 'グラップラー', url: 'https://github.com/user-attachments/assets/c60b70fa-996c-4f87-89ee-d3b1e0c019a0' },
      { name: 'クレリック', url: 'https://github.com/user-attachments/assets/60e73b78-579e-4f66-b36d-13841644c544' },
      { name: 'サモナー', url: 'https://github.com/user-attachments/assets/48d3d342-1b12-4c1b-a80c-2c139aa1cb7c' }
    ];
    
    const bottomImages = [
      { name: 'シューター', url: 'https://github.com/user-attachments/assets/1fae8519-2bf2-49ea-ad52-5be298e72368' },
      { name: 'セイジ', url: 'https://github.com/user-attachments/assets/aea2a6a9-bc8f-4507-a2d5-7918947819ec' },
      { name: 'ダンサー', url: 'https://github.com/user-attachments/assets/65b07841-b4eb-4414-a5cd-63ffdda236f6' },
      { name: 'テイマー', url: 'https://github.com/user-attachments/assets/37a6ff95-9d5c-4db9-ad83-3905a912cc3e' },
      { name: 'ナイト', url: 'https://github.com/user-attachments/assets/a03c0ec0-7687-4f51-9923-052e3e5bcef0' }
    ];
    
    return (
      <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4 overflow-hidden">
        <div className="w-full max-w-4xl">
          {/* 上段カルーセル（右→左） */}
          <div className="mb-8 overflow-hidden">
            <div className="flex animate-scroll-right">
              {[...topImages, ...topImages].map((img, i) => (
                <div key={i} className="flex-shrink-0 w-32 h-32 mx-3">
                  <img 
                    src={img.url} 
                    alt={img.name}
                    className="w-full h-full object-contain"
                  />
                </div>
              ))}
            </div>
          </div>

          {/* 中央コンテンツ */}
          <div className="bg-white rounded-2xl shadow-xl p-8 sm:p-12 text-center border border-gray-200 my-8">
            <h1 className="text-4xl sm:text-5xl font-bold text-gray-900 mb-4">
              仕事と介護の両立準備<br />あなたの介護タイプチェック
            </h1>
            <p className="text-gray-600 mb-2 text-lg leading-relaxed">
              仕事と介護の両立に関する傾向を、<br className="sm:hidden" />7つの質問を通じて10タイプでチェック
            </p>
            <p className="text-sm text-gray-500 mb-6">
              ※ RPG風のジョブタイプで、あなたの立ち位置を分析します
            </p>
            <div className="bg-gray-50 p-4 rounded-lg mb-6 text-sm text-gray-600 leading-relaxed border border-gray-200">
              <p className="mb-2">
                <strong>※ このチェックは、まだ介護が始まっていない方や、これから備えたい方に向けたものです。</strong>
              </p>
              <p>
                今まさに介護で大変な思いをされている方は、
                <a 
                  href="https://navi.lyxis.com/q_a" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="text-gray-900 hover:text-gray-700 underline font-semibold mx-1"
                >
                  サポナビQA 仕事と介護の両立相談室
                </a>
                をご利用ください。あくまで簡易的なチェックとして、考えるきっかけにご活用ください。
              </p>
            </div>
            <button
              onClick={() => setStarted(true)}
              className="bg-gray-900 text-white px-12 py-4 rounded-lg text-xl font-semibold hover:bg-gray-800 transition-all duration-300"
            >
              チェックを始める
            </button>
          </div>

          {/* 下段カルーセル（左→右） */}
          <div className="mt-8 overflow-hidden">
            <div className="flex animate-scroll-left">
              {[...bottomImages, ...bottomImages].map((img, i) => (
                <div key={i} className="flex-shrink-0 w-32 h-32 mx-3">
                  <img 
                    src={img.url} 
                    alt={img.name}
                    className="w-full h-full object-contain"
                  />
                </div>
              ))}
            </div>
          </div>
        </div>

        <style jsx>{`
          @keyframes scroll-right {
            0% {
              transform: translateX(0);
            }
            100% {
              transform: translateX(-50%);
            }
          }
          
          @keyframes scroll-left {
            0% {
              transform: translateX(-50%);
            }
            100% {
              transform: translateX(0);
            }
          }
          
          .animate-scroll-right {
            animation: scroll-right 20s linear infinite;
          }
          
          .animate-scroll-left {
            animation: scroll-left 20s linear infinite;
          }
          
          .animate-scroll-right:hover,
          .animate-scroll-left:hover {
            animation-play-state: paused;
          }
        `}</style>
      </div>
    );
  }

  if (showTypeList) {
    const allTypes = Object.values(types);
    
    return (
      <div className="min-h-screen bg-gray-50 p-4 py-12">
        <div className="max-w-4xl mx-auto">
          <div className="bg-white rounded-2xl shadow-xl border border-gray-200 mb-8 p-8 text-center">
            <h2 className="text-3xl sm:text-4xl font-bold text-gray-900 mb-4">全10タイプ一覧</h2>
            <p className="text-gray-600 mb-6">仕事と介護の両立における10のタイプをご紹介します</p>
            <div className="flex justify-center space-x-4">
              <button
                onClick={() => setShowTypeList(false)}
                className="bg-gray-900 text-white px-8 py-3 rounded-lg text-lg font-semibold hover:bg-gray-800 transition-all duration-300"
              >
                結果に戻る
              </button>
              <button
                onClick={resetDiagnosis}
                className="bg-gray-200 text-gray-900 px-8 py-3 rounded-lg text-lg font-semibold hover:bg-gray-300 transition-all duration-300"
              >
                もう一度チェックする
              </button>
            </div>
          </div>

          <div className="space-y-8">
            {allTypes.map((type) => (
              <div key={type.name} className="bg-white rounded-2xl shadow-xl border border-gray-200 p-8">
                <div className="text-center mb-6">
                  <img 
                    src={type.image} 
                    alt={type.name} 
                    className="w-48 h-48 mx-auto mb-4 rounded-xl object-cover border-2 border-gray-200"
                    onError={(e) => {
                      e.target.style.display = 'none';
                      e.target.nextSibling.style.display = 'flex';
                    }}
                  />
                  <div className="w-48 h-48 mx-auto mb-4 rounded-xl bg-gray-100 border-2 border-gray-200 hidden items-center justify-center">
                    <span className="text-4xl font-bold text-gray-400">{type.name}</span>
                  </div>
                  <h3 className="text-3xl font-bold text-gray-900 mb-2">{type.name}</h3>
                  <p className="text-lg text-gray-600">{type.catchphrase}</p>
                </div>

                <div className="space-y-4 text-gray-700 leading-relaxed">
                  <div className="bg-gray-50 p-5 rounded-xl border border-gray-200">
                    <h4 className="font-bold text-base mb-2 text-gray-900">タイプの説明</h4>
                    <p className="text-sm">{type.description}</p>
                  </div>

                  <div className="bg-white p-5 rounded-xl border-2 border-gray-300">
                    <h4 className="font-bold text-base mb-2 text-gray-900">⚠️ 注意ポイント</h4>
                    <p className="text-sm">{type.attention}</p>
                  </div>

                  <div className="bg-gray-900 text-white p-5 rounded-xl">
                    <h4 className="font-bold text-base mb-2">💡 ワンポイントアドバイス</h4>
                    <p className="text-sm">{type.advice}</p>
                  </div>

                  {type.articles && type.articles.length > 0 && (
                    <div className="bg-gray-50 p-5 rounded-xl border border-gray-200">
                      <h4 className="font-bold text-base mb-3 text-gray-900">📚 おすすめ記事</h4>
                      <div className="space-y-2">
                        {type.articles.map((article, index) => (
                          <a 
                            key={index}
                            href={article.url}
                            target="_blank" 
                            rel="noopener noreferrer"
                            className="block text-sm text-gray-900 hover:text-gray-700 underline"
                          >
                            {article.title}
                          </a>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>

          <div className="mt-8 text-center space-y-4">
            <button
              onClick={() => setShowTypeList(false)}
              className="bg-gray-900 text-white px-10 py-4 rounded-lg text-lg font-semibold hover:bg-gray-800 transition-all duration-300 mr-4"
            >
              結果に戻る
            </button>
            <button
              onClick={resetDiagnosis}
              className="bg-gray-200 text-gray-900 px-10 py-4 rounded-lg text-lg font-semibold hover:bg-gray-300 transition-all duration-300"
            >
              もう一度チェックする
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (result) {
    const showQALink = answers[7] === 'C'; // Q7（相談苦手）のみ
    const qaCategories = getQACategories(answers[6]);
    const baseArticle = { title: '1分でわかる「地域包括支援センター」──頼れる場所があるという安心', url: 'https://navi.lyxis.com/posts/9019' };
    
    return (
      <div className="min-h-screen bg-gray-50 p-4 py-12">
        <div className="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl border border-gray-200">
          <div className="bg-gray-900 p-8 text-center rounded-t-2xl">
            <h2 className="text-3xl sm:text-4xl font-bold text-white mb-2">チェック結果</h2>
          </div>
          
          <div className="p-8 sm:p-12">
            <div className="text-center mb-8">
              <img 
                src={result.image} 
                alt={result.name} 
                className="w-64 h-64 mx-auto mb-6 rounded-xl object-cover border-2 border-gray-200"
                onError={(e) => {
                  e.target.style.display = 'none';
                  e.target.nextSibling.style.display = 'flex';
                }}
              />
              <div className="w-64 h-64 mx-auto mb-6 rounded-xl bg-gray-100 border-2 border-gray-200 hidden items-center justify-center">
                <span className="text-6xl font-bold text-gray-400">{result.name}</span>
              </div>
              <h3 className="text-4xl font-bold text-gray-900 mb-3">{result.name}</h3>
              <p className="text-xl text-gray-600 mb-4">{result.catchphrase}</p>
            </div>

            <div className="space-y-6 text-gray-700 leading-relaxed">
              <div className="bg-gray-50 p-6 rounded-xl border border-gray-200">
                <h4 className="font-bold text-lg mb-3 text-gray-900">タイプの説明</h4>
                <p>{result.description}</p>
              </div>

              <div className="bg-white p-6 rounded-xl border-2 border-gray-300">
                <h4 className="font-bold text-lg mb-3 text-gray-900">⚠️ 注意ポイント</h4>
                <p>{result.attention}</p>
              </div>

              <div className="bg-gray-900 text-white p-6 rounded-xl">
                <h4 className="font-bold text-lg mb-3">💡 ワンポイントアドバイス</h4>
                <p>{result.advice}</p>
              </div>

              {showQALink && (
                <div className="bg-gray-100 p-6 rounded-xl border border-gray-300">
                  <p className="mb-3 text-gray-700">お話を聞かせていただけませんか？</p>
                  <a 
                    href="https://navi.lyxis.com/q_a" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    className="text-gray-900 hover:text-gray-700 underline font-semibold"
                  >
                    他の人の相談内容に、近い状況の方がいるかもしれません。まずは見てみるだけでも。 →
                  </a>
                </div>
              )}

              <div className="bg-gray-50 p-6 rounded-xl border border-gray-200">
                <h4 className="font-bold text-lg mb-4 text-gray-900">📚 お役立ち情報</h4>
                
                {/* 基本記事 */}
                <div className="mb-4">
                  <h5 className="font-semibold text-gray-800 mb-2">まず知っておきたいこと</h5>
                  <a 
                    href={baseArticle.url}
                    target="_blank" 
                    rel="noopener noreferrer"
                    className="block text-gray-900 hover:text-gray-700 underline mb-2"
                  >
                    {baseArticle.title}
                  </a>
                </div>

                {/* タイプ別記事 */}
                {result.articles && result.articles.length > 0 && (
                  <div className="mb-4">
                    <h5 className="font-semibold text-gray-800 mb-2">あなたのタイプに合った記事</h5>
                    {result.articles.map((article, index) => (
                      <a 
                        key={index}
                        href={article.url}
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="block text-gray-900 hover:text-gray-700 underline mb-2"
                      >
                        {article.title}
                      </a>
                    ))}
                  </div>
                )}

                {/* QAカテゴリ */}
                {qaCategories && qaCategories.length > 0 && (
                  <div>
                    <h5 className="font-semibold text-gray-800 mb-2">気になるテーマのQ&A</h5>
                    {qaCategories.map((category, index) => (
                      <a 
                        key={index}
                        href={category.url}
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="block text-gray-900 hover:text-gray-700 underline mb-2"
                      >
                        {category.title}のQ&Aを見る →
                      </a>
                    ))}
                  </div>
                )}
              </div>

              <div className="bg-gray-50 p-6 rounded-xl border border-gray-200 text-center">
                <p className="text-sm text-gray-600">
                  このチェックはあくまで簡易的なものです。仕事と介護の両立について考え始めた第一歩、それ自体が素晴らしいことです。自分のペースで、無理なく進めてください。<br />
                  何か違うな、と思った方は、全タイプ一覧に自分に合うヒントがあるかもしれません。
                </p>
              </div>
            </div>

            <div className="mt-8 text-center space-y-4">
              <button
                onClick={() => setShowTypeList(true)}
                className="bg-gray-900 text-white px-10 py-4 rounded-lg text-lg font-semibold hover:bg-gray-800 transition-all duration-300 mr-4"
              >
                全タイプ一覧を見る
              </button>
              <button
                onClick={resetDiagnosis}
                className="bg-gray-200 text-gray-900 px-10 py-4 rounded-lg text-lg font-semibold hover:bg-gray-300 transition-all duration-300"
              >
                もう一度チェックする
              </button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl shadow-xl p-8 sm:p-12 max-w-2xl w-full border border-gray-200">
        <div className="mb-8">
          <div className="flex justify-between items-center mb-4">
            <span className="text-sm font-semibold text-gray-500">質問 {currentQuestion + 1} / {questions.length}</span>
            <span className="text-sm font-semibold text-gray-900">{Math.round(((currentQuestion + 1) / questions.length) * 100)}%</span>
          </div>
          <div className="w-full bg-gray-200 rounded-full h-2">
            <div 
              className="bg-gray-900 h-2 rounded-full transition-all duration-500"
              style={{ width: `${((currentQuestion + 1) / questions.length) * 100}%` }}
            ></div>
          </div>
        </div>

        <h2 className="text-2xl sm:text-3xl font-bold text-gray-900 mb-8 leading-relaxed">
          {currentQ.text}
        </h2>

        <div className="space-y-3">
          {currentQ.options.map((option) => {
            const isSelected = currentQ.multiple 
              ? (answers[currentQ.id] || []).includes(option.value)
              : answers[currentQ.id] === option.value;
              
            return (
              <button
                key={option.value}
                onClick={() => handleAnswer(option.value)}
                className={`w-full p-4 rounded-lg text-left transition-all duration-200 font-medium border-2 ${
                  isSelected
                    ? 'bg-gray-900 text-white border-gray-900'
                    : 'bg-white text-gray-700 border-gray-200 hover:border-gray-400'
                }`}
              >
                <span className="text-base">{option.label}</span>
              </button>
            );
          })}
        </div>

        <div className="mt-8 flex justify-between items-center">
          {currentQuestion > 0 ? (
            <button
              onClick={() => setCurrentQuestion(currentQuestion - 1)}
              className="px-6 py-3 text-gray-600 hover:text-gray-900 font-semibold transition-all duration-300"
            >
              ← 前の質問
            </button>
          ) : (
            <div></div>
          )}

          {currentQ.multiple && (
            <button
              onClick={handleMultipleNext}
              disabled={(answers[currentQ.id] || []).length === 0}
              className={`px-10 py-4 rounded-lg text-lg font-semibold transition-all duration-300 ${
                (answers[currentQ.id] || []).length === 0
                  ? 'bg-gray-200 text-gray-400 cursor-not-allowed'
                  : 'bg-gray-900 text-white hover:bg-gray-800'
              }`}
            >
              次へ
            </button>
          )}
        </div>
      </div>
    </div>
  );
};

export default CaregiverDiagnosis;

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CaregiverDiagnosis />);
  </script>
